services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mlops_churn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlops_churn"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --artifacts-destination /mlflow-data/artifacts
      --serve-artifacts
      --allowed-hosts "mlflow:5000,mlflow,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      USE_POSTGRES: "1"
      POSTGRES_DB: mlops_churn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  mlflowdata: